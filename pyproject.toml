[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-ops-data-platform"
version = "1.0.0"
description = "Replay-safe airline operations pipeline: Kafka, MinIO, PySpark and PostgreSQL"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3==1.40.45",
  "confluent-kafka==2.12.0",
  "psycopg[binary]==3.2.10",
  "pyspark==3.5.7",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.setuptools.packages.find]
include = ["airline_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires running Kafka, MinIO and PostgreSQL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
