name: Pipeline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build
        run: |
          docker compose config --quiet
          docker compose build bootstrap frontend
      - name: Lint
        run: docker compose run --rm --no-deps tests ruff check .
      - name: Unit tests with real local Spark
        run: docker compose run --rm --no-deps tests pytest -q tests/unit
      - name: Start the complete platform
        run: docker compose up -d
      - name: Wait for demo and end-to-end tests
        run: |
          code=$(docker wait "$(docker compose ps -aq demo)")
          docker compose logs --no-color demo
          test "$code" = 0
      - name: Verify dashboard and live API
        run: |
          curl --retry 12 --retry-connrefused --retry-delay 5 -fsS http://localhost:8088/ > /tmp/dashboard.html
          curl -fsS http://localhost:8088/api/dashboard > /tmp/dashboard.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/dashboard.json').read_text())
          assert data['mode'] == 'live'
          run = data['runs'][0]
          assert run['raw_count'] == 32
          assert len([f for f in data['flights'] if f['source_run_id'] == run['run_id']]) == 4
          checks = [c for c in data['checks'] if c['run_id'] == run['run_id']]
          assert len(checks) == 11 and all(c['passed'] for c in checks)
          assert 'AeroStream' in Path('/tmp/dashboard.html').read_text()
          PYTHON
      - name: Collect service logs and quality report
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log 2>&1
          docker compose ps -a > artifacts/services.txt
          docker compose exec -T postgres psql -U airline -d airline -c \
            'COPY (SELECT * FROM data_quality_report ORDER BY report_id) TO STDOUT WITH CSV HEADER' \
            > artifacts/data_quality_report.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-verification
          path: artifacts/
      - name: Stop CI services
        if: always()
        run: docker compose down -v
